[package]
name = "niri-dynamic-workspaces"
version = "0.12.0"
edition = "2021"
description = "A dynamic workspace switcher for the niri Wayland compositor"
license = "GPL-3.0-only"
repository = "https://github.com/nickolaj-jepsen/niri-dynamic-workspaces"
readme = "README.md"
keywords = ["niri", "wayland", "workspace", "gtk4"]
categories = ["command-line-utilities"]
include = ["/src/**/*.rs", "/build.rs", "/style.css", "/themes/*.css", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1"
async-channel = "2"
clap = { version = "4", features = ["derive"] }
niri-ipc = "=26.4.0"
# v4_16 fails the build on older GTK, which would silently drop style.css's var() and color-mix().
gtk4 = { version = "0.9", features = ["v4_16"] }
gtk4-layer-shell = "0.5"
gdk4 = "0.9"
glib = "0.20"
# The gio gtk4 re-exports; v2_80 adds ApplicationCommandLine::printerr_literal.
gio = { version = "0.20", features = ["v2_80"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"
shell-words = "1"
toml = "0.9"
dirs = "6"
nucleo-matcher = "0.3"
libc = "0.2"

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"  # common in mod-per-file layouts
wildcard_imports = "allow"         # used for gtk4::prelude::*
cast_possible_truncation = "allow" # u32/usize casts in layout math
