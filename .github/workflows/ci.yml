# release.yml runs after this workflow passes on main: keep its name, and keep gating jobs here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels its stale run; main runs group per sha, so none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # Upstream Nix; the default, Determinate Nix, also logs in to FlakeHub.
          determinate: false

      - name: changelog
        run: nix develop --command just changelog-check

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Key the cache on the dev shell's toolchain, not the runner's.
          cmd-format: nix develop -c {0}

      - name: cargo fmt
        run: nix develop --command cargo fmt -- --check

      - name: cargo clippy
        run: nix develop --command cargo clippy -- -D warnings

      - name: cargo test
        run: nix develop --command cargo test

      - name: cargo package
        run: nix develop --command cargo package --locked

  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      # Builds the package (with its cargo test) and evaluates the HM module and VM.
      - name: nix flake check
        run: nix flake check -L

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cmd-format: nix develop -c {0}

      - name: build
        run: nix develop --command cargo build

      - name: e2e
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          nix develop --command ./e2e/test.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-failures
          path: e2e/out/
