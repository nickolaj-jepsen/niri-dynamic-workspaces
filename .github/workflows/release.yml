name: Release

on:
  # Only green push runs on main get past the hand-off job's if.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to release, by default the tip of main
        required: false

permissions:
  contents: read

concurrency:
  # One release run at a time; each hand-off run gets a group of its own.
  group: release-${{ github.event_name == 'workflow_run' && github.run_id || 'queue' }}
  cancel-in-progress: false

env:
  # Under workflow_run, github.sha is main's tip, not the commit CI tested.
  SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}

jobs:
  # crates.io refuses Trusted Publishing tokens from workflow_run, so a
  # green CI run releases through a dispatch run of this workflow.
  hand-off:
    # event == push keeps out fork PRs whose branch is also named main.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write # gh workflow run
    steps:
      - name: Dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release.yml --ref main -f sha="$SHA"

  version:
    # Dispatch only from main, so a branch's copy of this workflow can't publish.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # Upstream Nix; the default, Determinate Nix, also logs in to FlakeHub.
          determinate: false

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Fails the run before anything is published when the version has no changelog entries.
      - name: Read release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes=$(nix shell --inputs-from . nixpkgs#just --command just changelog-notes "$VERSION")
          delimiter=$(openssl rand -hex 16)
          printf 'notes<<%s\n%s\n%s\n' "$delimiter" "$notes" "$delimiter" >> "$GITHUB_OUTPUT"

  publish-crate:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Trusted Publishing exchanges it for a crates.io token.
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check crates.io
        id: check
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "niri-dynamic-workspaces release (github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/niri-dynamic-workspaces/$VERSION")
          case $status in
            200) echo "$VERSION is already on crates.io"; published=true ;;
            404) published=false ;;
            *) echo "::error::crates.io answered HTTP $status"; exit 1 ;;
          esac
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.published == 'false'
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: steps.check.outputs.published == 'false'
        with:
          # Determinate Nix would log in to FlakeHub with this job's OIDC token.
          determinate: false

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.check.outputs.published == 'false'
        id: auth

      - name: Publish to crates.io
        if: steps.check.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: nix develop --command cargo publish --locked

  create-release:
    needs: [version, publish-crate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - name: Check release
        id: check
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.exists == 'false'
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false

      # The body is the version's CHANGELOG.md section, then a compare link to the previous tag (git describe needs fetch-depth 0).
      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' --exclude "$TAG" "$SHA" 2>/dev/null || true)
          {
            printf '%s\n' "$NOTES"
            if [ -n "$prev" ]; then
              printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$TAG"
            fi
          } > notes.md
          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file notes.md
