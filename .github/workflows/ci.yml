name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its stale run; main runs group per sha, so none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: Swatinem/rust-cache@v2
        with:
          # Key the cache on the dev shell's toolchain, not the runner's.
          cmd-format: nix develop -c {0}

      - name: cargo fmt
        run: nix develop --command cargo fmt -- --check

      - name: cargo clippy
        run: nix develop --command cargo clippy -- -D warnings

      - name: cargo test
        run: nix develop --command cargo test

      - name: cargo package
        run: nix develop --command cargo package --locked

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: Swatinem/rust-cache@v2
        with:
          cmd-format: nix develop -c {0}

      - name: build
        run: nix develop --command cargo build

      - name: e2e
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          nix develop --command ./e2e/test.sh

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failures
          path: e2e/out/
